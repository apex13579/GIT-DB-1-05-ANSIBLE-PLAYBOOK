---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_os_family in common_supported_os
    fail_msg: "Unsupported operating system family: {{ ansible_os_family }}"
    success_msg: "Operating system family {{ ansible_os_family }} is supported"

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
